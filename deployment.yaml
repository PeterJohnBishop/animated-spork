apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
        upstream gin_backend { server gin-service:3000; }
        upstream node_backend { server node-service:3000; }
        server {
            listen 80;
            location /gin {
                proxy_pass http://gin_backend;
                proxy_set_header Host $host;
            }
            location / {
                proxy_pass http://node_backend;
                proxy_set_header Host $host;
            }
        }
    }
---
# --- POSTGRES ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: "app_user"
        - name: POSTGRES_PASSWORD
          value: "app_password"
        - name: POSTGRES_DB
          value: "app_db"
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgstorage
      volumes:
      - name: pgstorage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
---
# --- GIN SERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gin-service
  template:
    metadata:
      labels:
        app: gin-service
    spec:
      containers:
      - name: gin-server
        image: peterjbishop/gin-server:latest
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          value: "postgres"
---
apiVersion: v1
kind: Service
metadata:
  name: gin-service
spec:
  ports:
  - port: 3000
  selector:
    app: gin-service
---
# --- NODE SERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-service
  template:
    metadata:
      labels:
        app: node-service
    spec:
      containers:
      - name: node-server
        image: peterjbishop/node-server:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: node-service
spec:
  ports:
  - port: 3000
  selector:
    app: node-service
---
# --- NGINX PROXY ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: nginx-proxy
